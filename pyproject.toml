[project]
name = "tone-analyzer"
version = "0.1.0"
description = "Reference 이미지의 톤과 색감을 분석해 DaVinci 등에서 쓸 수 있는 3D LUT(.cube)로 만드는 도구"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "gkrdyd97-sudo", email = "gkrdyd97@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.15",
    "streamlit>=1.67.0",
]

[project.scripts]
tone-analyzer = "tone_analyzer:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
